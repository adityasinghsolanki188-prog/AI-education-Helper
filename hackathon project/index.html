<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz Generator</title>
<link rel="stylesheet" href="stylish.css">
</head>
<body>

<div class="container">

  <h1>🤖 AI Quiz Generator</h1>

  <!-- Step 1: Select Topic -->
  <div id="topicScreen">
    <h2>Choose a Topic</h2>
    <button onclick="startQuiz('science')">Science</button>
    <button onclick="startQuiz('math')">Math</button>
    <button onclick="startQuiz('gk')">General Knowledge</button>
  </div>

  <!-- Step 2: Show Question -->
  <div id="quizScreen" class="hidden">
    <h2 id="questionText"></h2>
    <div id="optionsBox"></div>
    <p id="scoreText"></p>
    <button id="nextBtn" onclick="nextQuestion()">Next Question</button>
  </div>

  <!-- Step 3: Show Result -->
  <div id="resultScreen" class="hidden">
    <h2>Quiz Finished!</h2>
    <p id="finalScore"></p>
    <button onclick="restartQuiz()">Play Again</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
